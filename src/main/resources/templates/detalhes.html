<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Life | Detalhes</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <header class="site-header">
        <div class="container header-content">
            <a class="brand" th:href="@{/}" aria-label="Ir para o início">
                <span class="brand-logo"><img th:src="@{/img/newlife-logo-dark.png}" alt=""></span>
                <span class="brand-name">New Life <small>STARTUP DOCS</small></span>
            </a>
            <nav class="main-nav" aria-label="Navegação principal">
                <a class="nav-link" th:href="@{/}">Início</a>
                <a class="nav-link active" th:href="@{/documentos}">Documentos</a>
                <a class="nav-link" th:href="@{/documentos/novo}">Novo documento</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="container documents-page" aria-labelledby="detailTitle">
            <div class="page-heading">
                <div>
                    <p class="section-label">VISUALIZAÇÃO</p>
                    <h1 id="detailTitle" th:text="${documento.nome}">Fluxo de caixa 2025</h1>
                    <p>Detalhes do documento selecionado.</p>
                </div>
                <a class="button secondary" th:href="@{/documentos}">← Voltar à lista</a>
            </div>

            <div class="table-card detail-card">
                <p><strong>Categoria</strong><span th:text="${documento.categoria}">Financeiro</span></p>
                <p><strong>Responsável</strong><span th:text="${documento.responsavel}">Marina</span></p>
                <p><strong>Status</strong><span class="status" th:classappend="${documento.statusClass}" th:text="${documento.status}">Aprovado</span></p>
            </div>
        </section>
    </main>

    <footer class="site-footer"><div class="container footer-content"><span>New Life · protótipo Spring Boot</span><span>ORGANIZE · ACOMPANHE · EVOLUA</span></div></footer>
</body>

</html>

<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar | New Life</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body class="auth-page"><header th:replace="~{navegacao :: publico}"></header><main class="auth-panel"><h1>Entrar na sua conta</h1>
<form class="document-form" method="post" th:action="@{/login}">
                <input type="hidden" name="_csrf" th:value="${session.csrf}">
<p role="status" th:if="${mensagem}" th:text="${mensagem}"></p>
<p role="alert" th:if="${erro}" th:text="${erro}"></p>
<label for="email">E-mail</label><input id="email" name="email" type="email" autocomplete="username" required>
<label for="senha">Senha</label><input id="senha" name="senha" type="password" autocomplete="current-password" required>
<button class="button" type="submit">Entrar</button>
<a th:href="@{/criar-conta}">Criar conta</a></form></main></body></html>
